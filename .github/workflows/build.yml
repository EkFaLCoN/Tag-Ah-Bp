name: Eklentileri Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Java 25 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Depodaki dosyalari goster
        run: find . -not -path './.git/*' -not -path './.git' | head -100

      - name: Zip dosyalari varsa ac
        run: |
          for z in $(find . -name '*.zip' -not -path './.git/*'); do
            echo "=== $z aciliyor ==="
            unzip -oq "$z" -d "./acilan_$(basename "$z" .zip)"
          done

      - name: Tum eklentileri derle
        run: |
          POMS=$(find . -name pom.xml -not -path './.git/*')
          if [ -z "$POMS" ]; then
            echo "HATA: Depoda hic pom.xml yok. MarketAH, TagSistemi, GorevPass klasorleri yuklenmemis."
            exit 1
          fi
          for pom in $POMS; do
            echo "=== $pom derleniyor ==="
            mvn -B -f "$pom" clean package
          done

      - name: MarketAH jar yukle
        uses: actions/upload-artifact@v4
        with:
          name: MarketAH
          path: '**/target/MarketAH.jar'
          if-no-files-found: error

      - name: TagSistemi jar yukle
        uses: actions/upload-artifact@v4
        with:
          name: TagSistemi
          path: '**/target/TagSistemi.jar'
          if-no-files-found: error

      - name: GorevPass jar yukle
        uses: actions/upload-artifact@v4
        with:
          name: GorevPass
          path: '**/target/GorevPass.jar'
          if-no-files-found: error
