name: Eklentileri Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 25 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '*/pom.xml'

      - name: MarketAH derle
        run: mvn -B -f MarketAH/pom.xml clean package

      - name: TagSistemi derle
        run: mvn -B -f TagSistemi/pom.xml clean package

      - name: GorevPass derle
        run: mvn -B -f GorevPass/pom.xml clean package

      - name: MarketAH jar yukle
        uses: actions/upload-artifact@v4
        with:
          name: MarketAH
          path: MarketAH/target/MarketAH.jar
          if-no-files-found: error

      - name: TagSistemi jar yukle
        uses: actions/upload-artifact@v4
        with:
          name: TagSistemi
          path: TagSistemi/target/TagSistemi.jar
          if-no-files-found: error

      - name: GorevPass jar yukle
        uses: actions/upload-artifact@v4
        with:
          name: GorevPass
          path: GorevPass/target/GorevPass.jar
          if-no-files-found: error
