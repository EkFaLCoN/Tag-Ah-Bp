name: Eklentileri Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Java 25 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Klasorleri goster
        run: find . -name pom.xml -not -path './.git/*'

      - name: Tum eklentileri derle
        run: |
          for pom in $(find . -name pom.xml -not -path './.git/*'); do
            echo "=== $pom derleniyor ==="
            mvn -B -f "$pom" clean package
          done

      - name: MarketAH jar yukle
        uses: actions/upload-artifact@v4
        with:
          name: MarketAH
          path: '**/target/MarketAH.jar'
          if-no-files-found: error

      - name: TagSistemi jar yukle
        uses: actions/upload-artifact@v4
        with:
          name: TagSistemi
          path: '**/target/TagSistemi.jar'
          if-no-files-found: error

      - name: GorevPass jar yukle
        uses: actions/upload-artifact@v4
        with:
          name: GorevPass
          path: '**/target/GorevPass.jar'
          if-no-files-found: error
